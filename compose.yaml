name: spring-ai-mcp

services:
  spring-ai-mcp-server:
    build:
      context: .
    image: spring-ai-mcp-server:local
    ports:
      - "${SPRING_APP_PORT:-8080}:8080"
    environment:
      APP_WORKSPACE_ROOT: /workspace
      APP_WORKSPACE_DEFAULT_MAX_RESULTS: ${APP_WORKSPACE_DEFAULT_MAX_RESULTS:-100}
      APP_WORKSPACE_MAX_RESULTS_LIMIT: ${APP_WORKSPACE_MAX_RESULTS_LIMIT:-500}
      APP_WORKSPACE_DEFAULT_MAX_CHARACTERS: ${APP_WORKSPACE_DEFAULT_MAX_CHARACTERS:-12000}
      APP_WORKSPACE_MAX_CHARACTERS_LIMIT: ${APP_WORKSPACE_MAX_CHARACTERS_LIMIT:-50000}
      APP_WORKSPACE_MAX_READABLE_FILE_BYTES: ${APP_WORKSPACE_MAX_READABLE_FILE_BYTES:-2000000}
    volumes:
      - type: bind
        source: ${FILES_HOST_DIR:-./sample-files}
        target: /workspace
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # Deterministic OpenAI/Anthropic simulator built from pramalin/llmsim v0.10.1.
  # Its browser console is served by this same service at /_llmsim/console.
  llmsim:
    build:
      context: ./llmsim
      args:
        LLMSIM_VERSION: ${LLMSIM_VERSION:-0.10.1}
    image: spring-ai-mcp-llmsim:${LLMSIM_VERSION:-0.10.1}
    profiles: ["sim"]
    ports:
      - "${LLMSIM_PORT:-8089}:8089"
    environment:
      LLMSIM_SCRIPT: com.alaiengineering.filesmcp.llmsim.WorkspaceSummaryFlow
      LLMSIM_PORT: 8089
      LLMSIM_JOURNAL_MAX_ENTRIES: ${LLMSIM_JOURNAL_MAX_ENTRIES:-1000}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8089/_llmsim/status"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    restart: unless-stopped

  maven-test:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /workspace
    command: ["mvn", "-B", "test"]
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2

  mcp-smoke-test:
    build:
      context: ./test-harness
    image: spring-ai-mcp-test-harness:local
    profiles: ["test"]
    environment:
      MCP_URL: http://spring-ai-mcp-server:8080/mcp
      EXPECTED_FILE_COUNT: ${EXPECTED_FILE_COUNT:-3}
      EXPECTED_DIRECTORY_COUNT: ${EXPECTED_DIRECTORY_COUNT:-2}
    command: ["python", "-m", "harness.mcp_smoke"]

  agent-sim-test:
    build:
      context: ./test-harness
    image: spring-ai-mcp-test-harness:local
    profiles: ["test"]
    environment:
      MCP_URL: http://spring-ai-mcp-server:8080/mcp
      LLMSIM_BASE_URL: http://llmsim:8089/v1
      LLMSIM_STATUS_URL: http://llmsim:8089/_llmsim/status
      LLMSIM_CALLS_URL: http://llmsim:8089/_llmsim/calls
      LLMSIM_RESET_URL: http://llmsim:8089/_llmsim/reset
      LLMSIM_DASHBOARD_URL: http://llmsim:8089/_llmsim/dashboard
      LLMSIM_MODEL: ${LLMSIM_MODEL:-gpt-4o-mini}
      EXPECTED_FILE_COUNT: ${EXPECTED_FILE_COUNT:-3}
      EXPECTED_DIRECTORY_COUNT: ${EXPECTED_DIRECTORY_COUNT:-2}
    command: ["python", "-m", "harness.agent_scenario"]

volumes:
  maven-cache:
